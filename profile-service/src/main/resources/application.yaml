spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/profile_db}
    username: ${PROFILE_DB_USERNAME:postgres}
    password: ${PROFILE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    enabled-by-default: false

security:
  jwt:
    issuer: ${JWT_ISSUER:http://identity-service:8081}
    secret: ${JWT_SECRET}
